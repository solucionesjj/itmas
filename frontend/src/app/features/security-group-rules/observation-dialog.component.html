<h2 mat-dialog-title>{{ data.title }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'field.observation' | t }}</mat-label>
      <textarea matInput formControlName="observation" rows="4"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancel()">{{ 'action.cancel' | t }}</button>
    <button
      matButton="filled"
      type="submit"
      [disabled]="form.invalid"
    >
      {{ data.actionLabel }}
    </button>
  </mat-dialog-actions>
</form>
