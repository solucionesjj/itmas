<div class="header-row">
  <h1>Usuarios</h1>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    Nuevo usuario
  </button>
</div>

<table mat-table [dataSource]="users()" class="full-width">
  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let user">{{ user.username }}</td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Correo</th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Perfil</th>
    <td mat-cell *matCellDef="let user">{{ user.role }}</td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let user">{{ user.active ? 'Activo' : 'Inactivo' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Acciones</th>
    <td mat-cell *matCellDef="let user">
      <button
        mat-button
        (click)="openEditDialog(user)"
        [attr.aria-label]="'Editar usuario ' + user.username"
      >
        Editar
      </button>
      <button
        mat-button
        [disabled]="isSelf(user)"
        (click)="toggleActive(user)"
        [attr.aria-label]="(user.active ? 'Desactivar' : 'Activar') + ' usuario ' + user.username"
      >
        {{ user.active ? 'Desactivar' : 'Activar' }}
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

@if (!loading() && users().length === 0) {
  <p class="empty-state">No hay usuarios registrados.</p>
}
