<h2 mat-dialog-title>{{ 'devices.rotateConfirmTitle' | t }}</h2>

<mat-dialog-content>
  <p>{{ 'devices.rotateConfirmQuestion' | t: { hostname: data.hostname } }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" (click)="cancel()">{{ 'action.cancel' | t }}</button>
  <button matButton="filled" (click)="confirm()">{{ 'devices.rotateKey' | t }}</button>
</mat-dialog-actions>
