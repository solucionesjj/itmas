<h2 mat-dialog-title>{{ 'devices.newTitle' | t }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'field.hostname' | t }}</mat-label>
      <input matInput formControlName="hostname" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'field.category' | t }}</mat-label>
      <mat-select formControlName="category">
        @for (c of categories; track c.value) {
          <mat-option [value]="c.value">{{ c.labelKey | t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button matButton type="button" (click)="cancel()">{{ 'action.cancel' | t }}</button>
    <button matButton="filled" type="submit" [disabled]="form.invalid">
      {{ 'action.create' | t }}
    </button>
  </mat-dialog-actions>
</form>
