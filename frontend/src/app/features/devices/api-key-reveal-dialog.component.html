<h2 mat-dialog-title>Clave de API generada</h2>

<mat-dialog-content>
  <p>
    Dispositivo <strong>{{ data.hostname }}</strong> ({{ data.deviceId }})
  </p>

  <p class="warning">
    <mat-icon aria-hidden="true">warning</mat-icon>
    Guarda esta clave ahora — no se mostrará de nuevo. Configúrala en el
    agente como encabezado <code>X-Node-Api-Key</code>.
  </p>

  <div class="key-row">
    <code class="api-key">{{ data.apiKey }}</code>
    <button
      mat-icon-button
      [cdkCopyToClipboard]="data.apiKey"
      (cdkCopyToClipboardCopied)="onCopied($event)"
      aria-label="Copiar clave de API al portapapeles"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" mat-dialog-close>Entendido</button>
</mat-dialog-actions>
