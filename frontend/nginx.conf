server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening (agent.md §9 — reverse-proxy hardening). TLS termination
    # itself belongs to the gateway/reverse proxy in front of this container,
    # not here — see DEPLOYMENT.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        # environment.ts (production) uses a relative apiBaseUrl ('/api/v1'),
        # so this container must proxy it to the backend service over the
        # Compose network — otherwise every API call 404s/405s against
        # nginx's own static-file handler instead of reaching the backend.
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # SPA fallback: any unmatched path serves index.html so Angular's
        # client-side router can handle deep links / hard refreshes.
        try_files $uri $uri/ /index.html;
    }
}
