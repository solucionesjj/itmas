# Release (SPEC-0009 RF-14, RF-18, RF-19; ADR-0020). Pushing a tag vMAJOR.MINOR.PATCH:
#   1. ci: the suites and the audits;
#   2. build-scan: builds the three images and blocks on high/critical findings that have a fix (Trivy). Read-only token, nothing is published;
#   3. publish: waits for the manual approval of the "production" GitHub environment and only then publishes all three images to GHCR
#      (immutable tags), and the agent packages when the agent version has no image yet.
# Nothing here reaches the server: a person runs "sudo scripts/deploy.sh <tag>" there. The only credential is the workflow's own GITHUB_TOKEN,
# and packages: write exists only in the publish job, which runs just first-party tooling, docker/login-action and download-artifact.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-scan:
    name: Build and scan the images
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: api
          load: true
          push: false
          tags: itmas3-scan/api:candidate
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build migrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: migrator
          load: true
          push: false
          tags: itmas3-scan/migrator:candidate
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          target: runtime
          load: true
          push: false
          tags: itmas3-scan/frontend:candidate
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # High and critical findings with a fix block the release; nothing has been published yet.
      - name: Scan api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: itmas3-scan/api:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan migrator
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: itmas3-scan/migrator:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: itmas3-scan/frontend:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Save the scanned images
        run: docker save -o "$RUNNER_TEMP/images.tar" itmas3-scan/api:candidate itmas3-scan/migrator:candidate itmas3-scan/frontend:candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish (after the manual approval)
    needs: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images (tags are immutable)
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/images/images.tar"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # A tag that already exists is never overwritten, and none of the three is published if one of them exists.
          for name in api migrator frontend; do
            if out="$(docker buildx imagetools inspect "ghcr.io/${owner}/itmas3-${name}:${TAG}" 2>&1)"; then
              echo "ghcr.io/${owner}/itmas3-${name}:${TAG} already exists; tags are immutable" >&2
              exit 1
            fi
            printf '%s' "$out" | grep -qiE 'not found|manifest unknown|404' || { echo "$out" >&2; exit 1; }
          done
          {
            echo "### Release ${TAG}"
            echo
            echo "Commit \`${GITHUB_SHA}\`. Compare it and these digests with what \`scripts/deploy.sh\` shows before you confirm."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for name in api migrator frontend; do
            ref="ghcr.io/${owner}/itmas3-${name}"
            docker tag "itmas3-scan/${name}:candidate" "${ref}:${TAG}"
            docker push "${ref}:${TAG}"
            digest="$(docker buildx imagetools inspect "${ref}:${TAG}" --format '{{.Manifest.Digest}}')"
            echo "- ${name}: \`${ref}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the agent packages if this agent version has none (versions are immutable)
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/Directory.Build.props)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Agent version not found or malformed in agent/Directory.Build.props" >&2
            exit 1
          fi
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/itmas3-agent:${version}"
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            echo "Agent ${version} is already published; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Only "not found" means "not published": an authentication or network error must not overwrite a published version.
          printf '%s' "$out" | grep -qiE 'not found|manifest unknown|404' || { echo "$out" >&2; exit 1; }
          # Same procedure as scripts/build-agent.sh: packages and SHA256SUMS come out of one build.
          docker build --target artifacts --output "type=local,dest=out/${version}" agent
          (cd "out/${version}" && sha256sum -c SHA256SUMS)
          printf 'FROM scratch\nCOPY . /\n' > "$RUNNER_TEMP/agent-packages.Dockerfile"
          docker build -f "$RUNNER_TEMP/agent-packages.Dockerfile" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$ref" out
          docker push "$ref"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          {
            echo "### Agent ${version}"
            echo
            echo "\`${ref%:*}@${digest}\`"
            echo
            echo '```'
            cat "out/${version}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
