# systemd drop-in for caddy.service (SPEC-0009 RF-27, constitution 8.7 d): loads the ITMas settings and applies a light sandbox.
# Installed by scripts/install-host-tasks.sh as /etc/systemd/system/caddy.service.d/itmas3.conf. Check "journalctl -u caddy" after changing it.
[Service]
EnvironmentFile=/etc/caddy/itmas3.env
# Only what a proxy on 80 and 443 needs: the packaged unit also grants CAP_NET_ADMIN, which HTTP/1.1 and HTTP/2 do not use.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
